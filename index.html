<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Sound Laboratory</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
}

.panel {
    width: 480px;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(0, 0, 0, .4);
    box-sizing: border-box;
}

h1 {
    text-align: center;
    margin-top: 0;
    font-size: 24px;
}

h3 {
    margin-top: 20px;
    margin-bottom: 5px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 5px;
    font-size: 16px;
    color: #3b82f6;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

label {
    display: block;
    margin-top: 10px;
    font-size: 13px;
    color: #cbd5e1;
}

input, select {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 8px;
    margin-top: 4px;
    font-size: 14px;
    background: #334155;
    color: white;
    box-sizing: border-box;
}

input[type="range"] {
    padding: 0;
    height: 8px;
    background: #475569;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: background 0.2s;
}

.play {
    background: #22c55e;
    color: white;
}
.play:hover { background: #16a34a; }

.download {
    background: #3b82f6;
    color: white;
}
.download:hover { background: #2563eb; }

.info {
    text-align: center;
    margin-top: 15px;
    opacity: .6;
    font-size: 12px;
}

canvas {
    width: 100%;
    height: 100px;
    background: #020617;
    border-radius: 10px;
    margin-top: 15px;
    display: block;
}
</style>
</head>
<body>

<div class="panel">

<h1>🎵 Advanced Sound Lab</h1>

<canvas id="visualizer"></canvas>

<h3>Primary Source</h3>
<div class="grid-2">
    <div>
        <label>Source Type</label>
        <select id="sourceType" onchange="toggleSourceParams()">
            <option value="oscillator">Oscillator</option>
            <option value="noise">Noise Generator</option>
        </select>
    </div>
    <div>
        <label>Waveform / Color</label>
        <select id="waveform">
            <option value="sine">Sine</option>
            <option value="square">Square</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="triangle">Triangle</option>
        </select>
        <select id="noiseType" style="display:none;">
            <option value="white">White Noise</option>
            <option value="rain">Rain Sim</option>
            <option value="fire">Fire Crackle</option>
            <option value="wind">Wind Sim</option>
        </select>
    </div>
</div>

<div id="oscParams">
    <div class="grid-2">
        <div>
            <label>Start Freq (Hz)</label>
            <input type="number" id="freqStart" value="440">
        </div>
        <div>
            <label>End Freq (Hz)</label>
            <input type="number" id="freqEnd" value="440">
        </div>
    </div>

    <h3>Timbre & Layering</h3>
    <div class="grid-2">
        <div>
            <label>Mix Layer</label>
            <select id="layering">
                <option value="none">Single Tone</option>
                <option value="octave">Octave Double</option>
                <option value="triad">Major Triad</option>
                <option value="detune">Detuned Unison</option>
            </select>
        </div>
        <div>
            <label>Harmonic Content</label>
            <input type="range" id="timbreHarmonics" min="0" max="100" value="0">
        </div>
    </div>
</div>

<h3>Modifiers & FX</h3>
<div class="grid-2">
    <div>
        <label>Filter Type</label>
        <select id="filterType">
            <option value="none">None</option>
            <option value="lowpass">Lowpass</option>
            <option value="highpass">Highpass</option>
            <option value="bandpass">Bandpass</option>
        </select>
    </div>
    <div>
        <label>Filter Cutoff (Hz)</label>
        <input type="number" id="filterCutoff" value="1000">
    </div>
</div>

<div class="grid-2">
    <div>
        <label>Echo Delay (sec)</label>
        <input type="number" id="echoDelay" value="0.3" step="0.1" min="0">
    </div>
    <div>
        <label>Echo Feedback (0-1)</label>
        <input type="number" id="echoFeedback" value="0.4" step="0.1" min="0" max="0.9">
    </div>
</div>

<h3>Global Parameters</h3>
<div class="grid-2">
    <div>
        <label>Amplitude (0 - 1)</label>
        <input type="number" id="amp" value="0.4" step="0.1">
    </div>
    <div>
        <label>Duration (seconds)</label>
        <input type="number" id="duration" value="3">
    </div>
</div>

<button class="play" onclick="playSound()">▶ Play Sound</button>
<button class="download" onclick="downloadSound()">⬇ Download WAV</button>

<div class="info">
Custom procedural synthesis engine with real-time emulation.
</div>

</div>

<script>
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let analyser = null;
let canvas = document.getElementById("visualizer");
let canvasCtx = canvas.getContext("2d");
let animationId = null;

// Initialize Canvas Size
canvas.width = canvas.getBoundingClientRect().width * window.devicePixelRatio;
canvas.height = 100 * window.devicePixelRatio;
canvasCtx.scale(window.devicePixelRatio, window.devicePixelRatio);

function toggleSourceParams() {
    const type = document.getElementById("sourceType").value;
    if (type === "oscillator") {
        document.getElementById("oscParams").style.display = "block";
        document.getElementById("waveform").style.display = "block";
        document.getElementById("noiseType").style.display = "none";
    } else {
        document.getElementById("oscParams").style.display = "none";
        document.getElementById("waveform").style.display = "none";
        document.getElementById("noiseType").style.display = "block";
    }
}

function drawVisualizer() {
    if (!analyser) return;
    animationId = requestAnimationFrame(drawVisualizer);

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteTimeDomainData(dataArray);

    const w = canvas.width / window.devicePixelRatio;
    const h = canvas.height / window.devicePixelRatio;
    
    canvasCtx.fillStyle = "#020617";
    canvasCtx.fillRect(0, 0, w, h);
    canvasCtx.lineWidth = 2;
    canvasCtx.strokeStyle = "#22c55e";
    canvasCtx.beginPath();

    const sliceWidth = w / bufferLength;
    let x = 0;

    for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = (v * h) / 2;

        if (i === 0) canvasCtx.moveTo(x, y);
        else canvasCtx.lineTo(x, y);

        x += sliceWidth;
    }

    canvasCtx.lineTo(w, h / 2);
    canvasCtx.stroke();
}

function createNoiseBuffer(type, duration, sampleRate) {
    const bufferSize = sampleRate * duration;
    const buffer = new Float32Array(bufferSize);
    let lastOut = 0.0; // Filter tracking for structural noise profiles
    
    for (let i = 0; i < bufferSize; i++) {
        let white = Math.random() * 2 - 1;
        
        if (type === "white") {
            buffer[i] = white;
        } else if (type === "rain") {
            // Low-pass filtered pink/brown flavor
            lastOut = 0.85 * lastOut + 0.15 * white;
            buffer[i] = lastOut * 2.5;
        } else if (type === "fire") {
            // Crackle spikes mixed into filtered noise
            lastOut = 0.80 * lastOut + 0.20 * white;
            let crackle = Math.random() > 0.997 ? (Math.random() * 2 - 1) * 0.8 : 0;
            buffer[i] = (lastOut * 0.5) + crackle;
        } else if (type === "wind") {
            // Slow modulation of filtering
            let t = i / sampleRate;
            let mod = Math.sin(2 * Math.PI * 0.25 * t) * 0.1 + 0.85;
            lastOut = mod * lastOut + (1 - mod) * white;
            buffer[i] = lastOut * 3.0;
        }
    }
    return buffer;
}

function playSound() {
    if (!audioCtx) audioCtx = new AudioContextClass();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (animationId) cancelAnimationFrame(animationId);

    const sourceType = document.getElementById("sourceType").value;
    const amplitude = parseFloat(document.getElementById("amp").value);
    const duration = parseFloat(document.getElementById("duration").value);
    const filterType = document.getElementById("filterType").value;
    const filterCutoff = parseFloat(document.getElementById("filterCutoff").value);
    const echoDelayVal = parseFloat(document.getElementById("echoDelay").value);
    const echoFeedbackVal = parseFloat(document.getElementById("echoFeedback").value);

    // Master Setup
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    
    const masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(amplitude, audioCtx.currentTime);
    masterGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    // Track audio nodes for termination
    let sources = [];

    if (sourceType === "oscillator") {
        const freqStart = parseFloat(document.getElementById("freqStart").value);
        const freqEnd = parseFloat(document.getElementById("freqEnd").value);
        const waveform = document.getElementById("waveform").value;
        const layering = document.getElementById("layering").value;
        const harmonicsVal = parseFloat(document.getElementById("timbreHarmonics").value) / 100;

        let freqs = [freqStart];
        let ends = [freqEnd];

        if (layering === "octave") {
            freqs.push(freqStart * 2); ends.push(freqEnd * 2);
        } else if (layering === "triad") {
            freqs.push(freqStart * 1.25); ends.push(freqEnd * 1.25); // Major 3rd
            freqs.push(freqStart * 1.5); ends.push(freqEnd * 1.5);   // Perfect 5th
        } else if (layering === "detune") {
            freqs.push(freqStart * 1.01); ends.push(freqEnd * 1.01);
            freqs.push(freqStart * 0.99); ends.push(freqEnd * 0.99);
        }

        freqs.forEach((fStart, idx) => {
            const osc = audioCtx.createOscillator();
            osc.type = waveform;
            osc.frequency.setValueAtTime(fStart, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(ends[idx], audioCtx.currentTime + duration);
            
            // Add harmonic overtone component based on Timbre control
            if (harmonicsVal > 0) {
                const hOsc = audioCtx.createOscillator();
                hOsc.type = "sine";
                hOsc.frequency.setValueAtTime(fStart * 3, audioCtx.currentTime);
                hOsc.frequency.linearRampToValueAtTime(ends[idx] * 3, audioCtx.currentTime + duration);
                const hGain = audioCtx.createGain();
                hGain.gain.setValueAtTime(harmonicsVal * 0.3, audioCtx.currentTime);
                hOsc.connect(hGain);
                hGain.connect(masterGain);
                hOsc.start();
                hOsc.stop(audioCtx.currentTime + duration);
            }

            osc.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        });

    } else {
        // Noise Path
        const noiseType = document.getElementById("noiseType").value;
        const rawData = createNoiseBuffer(noiseType, duration, audioCtx.sampleRate);
        const audioBuffer = audioCtx.createBuffer(1, rawData.length, audioCtx.sampleRate);
        audioBuffer.getChannelData(0).set(rawData);

        const noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = audioBuffer;
        noiseNode.connect(masterGain);
        noiseNode.start();
    }

    // Connect Processing Chain (FX Routing)
    let currentOut = masterGain;

    if (filterType !== "none") {
        const filterNode = audioCtx.createBiquadFilter();
        filterNode.type = filterType;
        filterNode.frequency.setValueAtTime(filterCutoff, audioCtx.currentTime);
        currentOut.connect(filterNode);
        currentOut = filterNode;
    }

    if (echoDelayVal > 0) {
        const delayNode = audioCtx.createDelay();
        const feedbackNode = audioCtx.createGain();
        
        delayNode.delayTime.setValueAtTime(echoDelayVal, audioCtx.currentTime);
        feedbackNode.gain.setValueAtTime(echoFeedbackVal, audioCtx.currentTime);
        
        currentOut.connect(delayNode);
        delayNode.connect(feedbackNode);
        feedbackNode.connect(delayNode); // Echo feedback loop
        
        const mixGain = audioCtx.createGain();
        mixGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
        currentOut.connect(mixGain);
        delayNode.connect(mixGain);
        currentOut = mixGain;
    }

    currentOut.connect(analyser);
    analyser.connect(audioCtx.destination);

    drawVisualizer();
}

function downloadSound() {
    const sourceType = document.getElementById("sourceType").value;
    const amplitude = parseFloat(document.getElementById("amp").value);
    const duration = parseFloat(document.getElementById("duration").value);
    const filterType = document.getElementById("filterType").value;
    const filterCutoff = parseFloat(document.getElementById("filterCutoff").value);
    const echoDelayVal = parseFloat(document.getElementById("echoDelay").value);
    const echoFeedbackVal = parseFloat(document.getElementById("echoFeedback").value);

    const sampleRate = 44100;
    const length = sampleRate * duration;
    let buffer = new Float32Array(length);

    // 1. Core Sample Generation Loop
    if (sourceType === "oscillator") {
        const freqStart = parseFloat(document.getElementById("freqStart").value);
        const freqEnd = parseFloat(document.getElementById("freqEnd").value);
        const waveform = document.getElementById("waveform").value;
        const layering = document.getElementById("layering").value;
        const harmonicsVal = parseFloat(document.getElementById("timbreHarmonics").value) / 100;

        let freqs = [freqStart];
        let ends = [freqEnd];

        if (layering === "octave") { freqs.push(freqStart*2); ends.push(freqEnd*2); }
        else if (layering === "triad") { 
            freqs.push(freqStart*1.25); ends.push(freqEnd*1.25); 
            freqs.push(freqStart*1.5); ends.push(freqEnd*1.5); 
        }
        else if (layering === "detune") { 
            freqs.push(freqStart*1.01); ends.push(freqEnd*1.01); 
            freqs.push(freqStart*0.99); ends.push(freqEnd*0.99); 
        }

        // Track accumulated phase for chirped/swept multi-frequencies
        let phases = new Float32Array(freqs.length);
        let harmonicPhases = new Float32Array(freqs.length);

        for (let i = 0; i < length; i++) {
            const t = i / sampleRate;
            let sampleSum = 0;

            for (let f = 0; f < freqs.length; f++) {
                // Linear frequency sweep integration formula
                let currentFreq = freqs[f] + ((ends[f] - freqs[f]) * (t / duration));
                phases[f] += (2 * Math.PI * currentFreq) / sampleRate;
                
                let s = 0;
                if (waveform === "sine") s = Math.sin(phases[f]);
                else if (waveform === "square") s = Math.sign(Math.sin(phases[f]));
                else if (waveform === "triangle") s = 2 * Math.asin(Math.sin(phases[f])) / Math.PI;
                else if (waveform === "sawtooth") s = 2 * (phases[f] / (2 * Math.PI) - Math.floor(phases[f] / (2 * Math.PI) + 0.5));

                if (harmonicsVal > 0) {
                    harmonicPhases[f] += (2 * Math.PI * (currentFreq * 3)) / sampleRate;
                    s += Math.sin(harmonicPhases[f]) * harmonicsVal * 0.3;
                }
                sampleSum += s;
            }
            // Linear gain envelope attenuation over time matching the Web Audio dynamics
            let env = (1.0 - (t / duration));
            buffer[i] = (sampleSum / freqs.length) * amplitude * env;
        }
    } else {
        const noiseType = document.getElementById("noiseType").value;
        const noiseData = createNoiseBuffer(noiseType, duration, sampleRate);
        for(let i=0; i<length; i++) {
            let env = (1.0 - ((i/sampleRate) / duration));
            buffer[i] = noiseData[i] * amplitude * env;
        }
    }

    // 2. Numerical Filter Application (Simple 1-Pole Digital DSP emulation)
    if (filterType !== "none") {
        let filtered = new Float32Array(length);
        let rc = 1.0 / (2 * Math.PI * filterCutoff);
        let dt = 1.0 / sampleRate;
        let alpha = dt / (rc + dt);
        let lastValue = 0;

        if (filterType === "lowpass") {
            for (let i = 0; i < length; i++) {
                filtered[i] = lastValue + alpha * (buffer[i] - lastValue);
                lastValue = filtered[i];
            }
            buffer = filtered;
        } else if (filterType === "highpass") {
            for (let i = 0; i < length; i++) {
                filtered[i] = alpha * (lastValue + buffer[i] - (i > 0 ? buffer[i-1] : 0));
                lastValue = filtered[i];
            }
            buffer = filtered;
        }
    }

    // 3. Digital Feedback Delay (Echo Simulation)
    if (echoDelayVal > 0) {
        let delaySamples = Math.floor(echoDelayVal * sampleRate);
        if (delaySamples > 0 && delaySamples < length) {
            let output = new Float32Array(length);
            for (let i = 0; i < length; i++) {
                output[i] = buffer[i];
                if (i >= delaySamples) {
                    output[i] += output[i - delaySamples] * echoFeedbackVal;
                }
            }
            buffer = output;
        }
    }

    const wav = createWav(buffer, sampleRate);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "synthesized_sound.wav";
    a.click();
    URL.revokeObjectURL(url);
}

function createWav(samples, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    function writeString(offset, str) {
        for (let i = 0; i < str.length; i++) {
            view.setUint8(offset + i, str.charCodeAt(i));
        }
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, samples.length * 2, true);

    let offset = 44;
    for (let i = 0; i < samples.length; i++) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
    }
    return buffer;
}
</script>

</body>
</html>
